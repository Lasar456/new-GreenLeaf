
name: Build GreenLeaf Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android native shell
        run: flutter create --platforms=android --project-name=greenleaf_mobile --org=com.greenleaf .

      - name: Apply Android settings
        run: |
          python3 - <<'PY_ANDROID'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          text = text.replace(
              'android:label="greenleaf_mobile"',
              'android:label="GreenLeaf"'
          )

          if 'android.permission.INTERNET' not in text:
              text = text.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.INTERNET"/>\n    <application',
                  1
              )

          manifest.write_text(text, encoding='utf-8')

          for gradle in (
              Path('android/app/build.gradle.kts'),
              Path('android/app/build.gradle')
          ):
              if gradle.exists():
                  content = gradle.read_text(encoding='utf-8')
                  content = content.replace(
                      'minSdk = flutter.minSdkVersion',
                      'minSdk = 24'
                  )
                  content = content.replace(
                      'minSdkVersion flutter.minSdkVersion',
                      'minSdkVersion 24'
                  )
                  gradle.write_text(content, encoding='utf-8')
          PY_ANDROID

      - name: Download packages
        run: flutter pub get

      - name: Build test/debug APK
        run: flutter build apk --debug

      - name: Build optimized release APK
        run: flutter build apk --release

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: GreenLeaf-Android-APKs
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
